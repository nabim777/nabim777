# GitHub Action for generating a contribution graph with a snake eating your contributions and trophy.
name: Generate Snake and Trophy

on:
  pull_request: 
  # schedule:
  #     # every 12 hours
  #   - cron: "0 */12 * * *"
    
  # # This command allows us to run the Action automatically from the Actions tab.
  # workflow_dispatch:
  
  # # Also run on every push on the main branch
  # push:
  #   branches:
  #   - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      #for storing the generated files
      - name: Prepare dist directory
        run:  mkdir dist
    
      - name: Generate the snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b #v3.5.0
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        env:
           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          # These are the inputs that can be used for the trophy generation. You can customize them as needed.
          # 'token', 'username', 'file', 'theme', 'max-cols', 'max-rows', 'panel-size', 'margin-width', 'margin-height', 'no-background', 'no-frame'
          username: ${{ github.repository_owner }}
          token: ${{ secrets.PAT }}
          file: ./dist/trophy.svg
          theme: onedark
          max-rows: 3
          max-cols: 4
          margin-width: 15
          margin-height: 15

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@e856fc8de9d7729b463c468911e232cfbdc3d55e #v2.0.2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&bg_color=0D1117
          path: ./dist/stats.svg
          token: ${{ secrets.PAT }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
           path: ./dist

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 #v5.0.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update trophy and snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
